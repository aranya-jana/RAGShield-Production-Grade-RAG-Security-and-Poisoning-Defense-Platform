[project]
name = "rag-poisoning-poc"
version = "0.1.0"
description = "RAG Poisoning Research - Hidden Parrot attack demonstration"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Core RAG Framework
    "langchain==1.3.9",
    "langchain-community==0.4.2",
    "langchain-openai==1.1.14",
    # API server
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-multipart>=0.0.20",
    # Vector Database
    "chromadb==0.4.24",
    "numpy<2",
    # Embeddings
    "sentence-transformers==2.7.0",
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "huggingface-hub>=0.20.0",
    # Configuration
    "python-dotenv==1.2.2",
    # Web scraping for llms.txt downloader
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "langchain-huggingface>=1.2.2",
]

[project.optional-dependencies]
# Optional local llama.cpp backend.
llamacpp = [
    "llama-cpp-python>=0.3.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
